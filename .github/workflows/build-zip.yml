name: Build plugin zip

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package WordPress plugin
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "main" ] || [ "${VERSION}" = "master" ]; then
            VERSION="1.0.0"
          fi
          rm -rf build dist
          mkdir -p build/researchgr-migrator dist
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude 'dist' \
            --exclude '.gitignore' \
            --exclude '.gitattributes' \
            ./ build/researchgr-migrator/
          (
            cd build
            zip -r "../dist/researchgr-migrator-${VERSION}.zip" researchgr-migrator
          )
          unzip -l "dist/researchgr-migrator-${VERSION}.zip" | head -n 40

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: researchgr-migrator
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach zip to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
